[project]
name = "coderag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "gitpython>=3.1.62",
    "google-genai>=2.25.0",
    "groq>=1.7.0",
    "langchain-community==0.3.31",
    "langchain-google-vertexai>=3.2.4",
    "langchain-huggingface>=1.2.2",
    "langchain-openai<1.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.3",
    "ragas==0.2.15",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
coderag = "coderag:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
